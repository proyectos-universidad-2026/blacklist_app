name: Pruebas de integración
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  pruebas_integracion:
    name: pruebas_integracion
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///ci_blacklist.db
      BEARER_TOKEN: test-token
    steps:
      - name: Checkout de repositorio
        uses: actions/checkout@v4

      - name: Configuración de entorno de python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configuración de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalación de Newman
        run: npm install -g newman

      - name: Instalación de dependencias del servicio
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-sqlalchemy flask-cors marshmallow python-dotenv gunicorn

      - name: Levantar servicio blacklist_email
        run: |
          gunicorn -w 1 -b 127.0.0.1:5001 src.main:app &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:5001/blacklists/ping >/dev/null; then
              echo "Servicio listo"
              exit 0
            fi
            sleep 1
          done
          echo "El servicio no respondió a /blacklists/ping"
          exit 1

      - name: Ejecutar colección Postman con Newman
        run: |
          newman run postman/blacklist_email.postman_collection.json \
            -e postman/blacklist_email.postman_environment.json \
            --env-var "baseUrl=http://127.0.0.1:5001" \
            --env-var "bearerToken=${BEARER_TOKEN}"
