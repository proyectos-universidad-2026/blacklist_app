apiVersion: apps/v1
kind: Deployment
metadata:
  name: blacklist-app
  namespace: curso
  labels:
    app: blacklist-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blacklist-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: blacklist-app
        version: "1.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # el UID fijado en el Dockerfile
      initContainers:
        - name: esperar-postgres # patrón init container
          image: postgres:14
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do echo esperando BD; sleep 2; done"]
      containers:
        - name: blacklist-app
          image: blacklist-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: blacklist-secret
                  key: DATABASE_URL
            - name: BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: blacklist-secret
                  key: BEARER_TOKEN
          readinessProbe:
            httpGet:
              path: /blacklists/ping
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /blacklists/ping
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi # 4 workers de gunicorn
          securityContext:
            allowPrivilegeEscalation: false
